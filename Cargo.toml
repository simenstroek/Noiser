[package]
name = "noiser"
version = "0.4.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui_extras = { version = "0.37", features = ["svg"] }
exr = "1.74.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tobj = "4"
pollster = "1.0.2"

# Debug builds of egui/wgpu are many times slower; optimize dependencies but keep our own code
# quick to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = "0.37"
naga = { version = "30.0.2", features = ["wgsl-in"] }
pollster = "1.0.2"
