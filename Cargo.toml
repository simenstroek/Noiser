[package]
name = "noiser"
version = "0.20.2"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui_extras = { version = "0.37", features = ["svg"] }
exr = "1.74.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tobj = "4"
gltf = { version = "1", default-features = false, features = ["import", "utils"] }  # glTF / GLB import
pollster = "1.0.2"
naga = { version = "30.0.2", features = ["wgsl-in", "wgsl-out", "hlsl-out", "glsl-out"] }
xatlas-rs-v2 = "0.1.4"
mikktspace = "0.3.0"
ufbx = "0.11.5"

# Debug builds of egui/wgpu are many times slower; optimize dependencies but keep our own code
# quick to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = "0.37"

[build-dependencies]
winresource = "0.1"
